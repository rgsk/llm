[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "beartype>=0.22.9",
    "byname",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "regex>=2026.7.19",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.17.0",
    "wandb>=0.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# `uv sync` installs the project editable, and this puts these folders on every interpreter's sys.path
# (a .pth in .venv): scripts, Alt+R, uv run, byname run, Jupyter kernels, the debugger and pytest all find
# `utils`, `tokenizer` and friends from anywhere, as the checker does
dev-mode-dirs = ["src", "src/video", "src/scratch"]

[tool.hatch.build.targets.wheel]
bypass-selection = true  # nothing to package: the install is only for the paths above

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    # <7: ipykernel 7 reworked the kernel async/status protocol and the
    # current VS Code Jupyter ext (2025.9.1) can miss the reply that ends
    # a cell -- outputs land but the spinner never resolves, needing a reload
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1.9",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
# the folders whose modules are first-party, so imports from them sort together (I001), as extraPaths makes
# them importable for the checker below; keep the three lists in step with dev-mode-dirs above
src = ["src", "src/video", "src/scratch"]

[tool.pytest.ini_options]
# registering the mark silences the unknown-mark warning; --strict-markers is
# what makes it useful, turning a typo'd @pytest.mark.slwo into a collection
# error instead of a mark that silently never gets deselected
addopts = ["--strict-markers"]
markers = ["slow: seconds, not milliseconds -- skip with -m 'not slow'"]

[tool.uv.sources]
byname = { path = "../byname", editable = true }

[tool.basedpyright]
# read by the editor (byname lsp) and Alt+L (`byname tool basedpyright`) alike. .py files are checked in
# "standard" too, but the editor shows only .pyn findings (byname.pythonDiagnostics false): .py errors are
# for Alt+L
typeCheckingMode = "standard"
extraPaths = ["src", "src/video", "src/scratch"]
# a module in a file's own folder first, as at runtime (the script's folder leads sys.path). basedpyright
# otherwise tries that folder last, after extraPaths and the .pth, so a same-named module elsewhere (src/x.py
# next to src/records/x.py) would win. One entry per folder that shadows a module from another
executionEnvironments = [{ root = "src/records" }]
