[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "beartype>=0.22.9",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "regex>=2026.7.19",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.17.0",
    "wandb>=0.28.2",
]

[dependency-groups]
dev = [
    # <7: ipykernel 7 reworked the kernel async/status protocol and the
    # current VS Code Jupyter ext (2025.9.1) can miss the reply that ends
    # a cell -- outputs land but the spinner never resolves, needing a reload
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1.9",
    "mypy>=2.3.1",
    "nbconvert>=7.17.1",
    "nbqa>=1.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
# ruff infers first-party packages from the cwd, so the CLI (run inside src/video)
# and the VS Code extension (run from the repo root) sorted imports differently --
# `tokenizer` resolves to src/tokenizer.py from one and src/video/tokenizer.py from
# the other. Pinned here to match settings.json's python.analysis.extraPaths.
src = ["src", "src/video", "src/scratch"]

[tool.pytest.ini_options]
# registering the mark silences the unknown-mark warning; --strict-markers is
# what makes it useful, turning a typo'd @pytest.mark.slwo into a collection
# error instead of a mark that silently never gets deselected
addopts = ["--strict-markers"]
markers = ["slow: seconds, not milliseconds -- skip with -m 'not slow'"]
